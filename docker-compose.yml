# Infraestrutura local do Bico em Casa — PostgreSQL 18 e MinIO (ADR-0006).
# Credenciais de desenvolvimento vem do .env (ignorado pelo git); .env.exemplo documenta as chaves.
# Nenhuma chave RSA e nenhuma credencial real e versionada aqui.

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: bec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bicoemcasa}
      POSTGRES_USER: ${POSTGRES_USER:-bicoemcasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bicoemcasa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A imagem do PostgreSQL 18 mudou o PGDATA para /var/lib/postgresql/18/docker e
      # declara o VOLUME em /var/lib/postgresql. Montar em /var/lib/postgresql/data,
      # como se fazia ate o 17, criaria um diretorio inutil e os dados nao sobreviveriam
      # a um `docker compose down`.
      - bec-postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bicoemcasa} -d ${POSTGRES_DB:-bicoemcasa}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bec-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bicoemcasa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bicoemcasa123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - bec-minio-dados:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: bec-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bicoemcasa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bicoemcasa123}
    # A imagem minio/minio nao traz curl, entao um healthcheck nela nunca fica verde e
    # travaria o depends_on para sempre. A espera e feita aqui, no laco explicito.
    # `mc mb --ignore-existing` mantem o `docker compose up` idempotente: sem isso o
    # SEGUNDO up morre com "bucket already exists".
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Aguardando o MinIO responder em http://minio:9000..."
          sleep 1
        done
        mc mb --ignore-existing local/portfolios
        mc mb --ignore-existing local/anexos
        mc mb --ignore-existing local/avatares
        echo "Buckets portfolios, anexos e avatares prontos."

volumes:
  bec-postgres-dados:
  bec-minio-dados:
